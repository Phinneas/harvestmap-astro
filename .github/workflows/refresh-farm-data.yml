name: Refresh USDA + PYO Farm Data

on:
  schedule:
    # 04:00 UTC on the 1st of each month
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      state:
        description: 'Single state code (e.g., CA) — leave empty for all 50 states'
        required: false
        default: ''
      states:
        description: 'Comma-separated state codes (e.g., CA,OR,WA)'
        required: false
        default: ''
      usda-only:
        description: 'Skip PickYourOwn.org scraping'
        type: boolean
        required: false
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh farm data
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.states }}" ]; then
            ARGS="--states=${{ github.event.inputs.states }}"
          elif [ -n "${{ github.event.inputs.state }}" ]; then
            ARGS="--state=${{ github.event.inputs.state }}"
          fi
          if [ "${{ github.event.inputs.usda-only }}" = "true" ]; then
            ARGS="$ARGS --usda-only"
          fi
          npx tsx scripts/refresh-farm-data.ts $ARGS

      - name: Check for changes
        id: changes
        run: |
          git diff --stat
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/farms/
          git commit -m "chore: monthly farm data refresh ($(date -u +%Y-%m-%d))"
          git push

      - name: Trigger Cloudflare Pages rebuild
        if: steps.changes.outputs.changed == 'true' && env.CF_DEPLOY_HOOK != ''
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          curl -X POST "$CF_DEPLOY_HOOK" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}'
